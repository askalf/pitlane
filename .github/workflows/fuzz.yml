# Fuzzing of pitlane's input parsers with Jazzer.js (libFuzzer): every target in ./fuzz runs for
# FUZZ_SECONDS against a corpus that persists between runs through the Actions cache. A crash, an
# uncaught throw or a timeout fails the job and the reproducing input is uploaded as an artifact.
# This workflow is the fuzzer; cflite.yml is only a coverage report, because ClusterFuzzLite's
# action cannot fuzz JavaScript: it rejects every sanitizer for JS, rejects `none`, and `coverage`
# selects its report runner. Weekly, on demand, and on every pull request with a short budget. The
# job runs on every pull request and skips the fuzzing itself (reporting green) when no target or
# code under a target changed, so it can be a required check without blocking unrelated changes.
#
# A public repository takes pull requests from forks, so the jobs added with this workflow (and
# cflite.yml) run on GitHub's runners only: none of them ever reaches a self-hosted row.
name: Fuzz

on:
  schedule:
    - cron: '23 6 * * 2' # weekly, Tuesday 06:23 UTC, after the coverage report's slot
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        required: false
        default: '300'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (Jazzer.js)
    # Never from a fork: the schedule is inherited by every fork and means nothing there.
    if: github.repository == 'askalf/pitlane'
    runs-on: ubuntu-latest
    # A pull request fuzzes 60 s per target (four targets) and finishes in a few minutes; the weekly
    # run gets 300 s per target.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 40 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Which paths the pull request touches, against its base commit. The diff is between the two
      # commits rather than from the merge base, so a branch behind main may list main's own
      # changes too: that can only fuzz more often, never less. Rename detection is off so a move
      # lists both its source and its destination. A test file is not a target's code.
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request: every target runs"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          relevant=$(echo "$changed" | grep -v '\.test\.mjs$' | grep -E '^(fuzz/|runners/[^/]+\.mjs$|box-ci/[^/]+\.mjs$|canary/[^/]+\.mjs$|\.clusterfuzzlite/|\.github/workflows/fuzz\.yml$)' || true)
          if [ -n "$relevant" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "fuzz-relevant paths changed:"
            echo "$relevant" | while IFS= read -r f; do echo "  $f"; done
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no fuzz target or code under a target changed; the fuzzing is skipped and this check reports green"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 22
      # pitlane has no package.json: Jazzer.js is the only dependency, from its own lockfile.
      - name: Install the fuzz dependencies (Jazzer.js)
        if: steps.scope.outputs.run == 'true'
        run: npm ci --prefix .clusterfuzzlite --no-audit --no-fund
      # The newest saved corpus, whichever run saved it; the save below writes a fresh key each
      # run so the restore-keys prefix always finds the latest.
      - name: Restore the corpus
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz every target
        if: steps.scope.outputs.run == 'true'
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '300' }}
          FUZZ_CORPUS_DIR: fuzz/corpus
          FUZZ_ARTIFACT_DIR: fuzz/crashes
        run: node fuzz/run.mjs
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/crashes
          if-no-files-found: ignore
      # Only runs on the default branch feed the shared corpus; a pull request's cache is scoped
      # to its branch anyway.
      - name: Save the corpus
        if: always() && github.event_name != 'pull_request' && steps.scope.outputs.run == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
