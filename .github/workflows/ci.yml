name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A public repository takes pull requests from forks, so its CI runs on GitHub's runners only:
    # no job of this repository ever reaches a self-hosted row.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: askalf/ci/actions/checkout-with-retry@669bb7eba67e7015586f54fb7959ae3071127a72 # main, askalf/ci#186
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Unit tests
        # Two reporters: dot on the log (one character a test, an X for a failure; the runner streams every log
        # line to GitHub, and TAP listed each passing test, 2,600 lines a run) and spec to a file, printed only
        # when a test fails, since dot alone names no failing test and shows no assertion.
        run: |
          node --test --test-reporter=dot --test-reporter-destination=stdout --test-reporter=spec --test-reporter-destination="$RUNNER_TEMP/test-report.txt" runners/*.test.mjs canary/*.test.mjs box-ci/*.test.mjs \
            || { echo; echo "== failing tests (spec reporter)"; cat "$RUNNER_TEMP/test-report.txt"; exit 1; }

      - name: Shell scripts parse
        run: |
          for f in runners/*.sh canary/*.sh box-ci/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: Example config is consistent
        run: node runners/runner-config.mjs
