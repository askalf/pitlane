version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request per run: separate bumps of codeql-action/init and /analyze would leave the
    # CodeQL workflow with mismatched versions.
    groups:
      actions:
        patterns:
          - "*"
